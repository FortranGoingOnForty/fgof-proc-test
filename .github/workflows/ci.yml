name: CI

on:
  push:
    branches:
      - trunk
  pull_request:

permissions:
  contents: read

env:
  FPM_VERSION: "0.13.0"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Fortran toolchain
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: latest

      - name: Install fpm from official release
        if: runner.os != 'macOS'
        run: |
          asset="fpm-${FPM_VERSION}-linux-x86_64-gcc-12"
          curl -fsSLo "${asset}" "https://github.com/fortran-lang/fpm/releases/download/v${FPM_VERSION}/${asset}"
          curl -fsSLo "${asset}.sha256" "https://github.com/fortran-lang/fpm/releases/download/v${FPM_VERSION}/${asset}.sha256"
          shasum -a 256 -c "${asset}.sha256"
          chmod +x "${asset}"
          mv "${asset}" fpm
          echo "${PWD}" >> "$GITHUB_PATH"

      - name: Install fpm with Homebrew
        if: runner.os == 'macOS'
        run: |
          brew tap fortran-lang/homebrew-fortran
          brew install fpm

      - name: Show tool versions
        run: |
          fpm --version
          "$FC" --version
          "$CC" --version

      - name: Run test suite
        run: fpm test --verbose

      - name: Run tracked examples
        shell: bash
        run: |
          assertion_demo="$(find build -type f -path '*/example/assertion_demo' | head -n 1)"
          setup_cleanup_demo="$(find build -type f -path '*/example/setup_cleanup_demo' | head -n 1)"

          test -n "${assertion_demo}"
          test -n "${setup_cleanup_demo}"

          assertion_output="$("${assertion_demo}")"
          setup_output="$("${setup_cleanup_demo}")"

          printf '%s\n' "${assertion_output}" | grep -q "ok"
          printf '%s\n' "${setup_output}" | grep -q "ready"
